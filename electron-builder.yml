appId: com.sealed.app
productName: Sealed
copyright: Copyright © 2026 Myrafy

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

afterSign: scripts/notarize.cjs

mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # CI passes -c.mac.identity=null when CSC_LINK is unset (see release.yml).
  # Do not hardcode identity: null here — that would skip signing even with CSC_LINK.
  # Built-in notarize disabled — scripts/notarize.cjs runs afterSign and
  # skips when Apple secrets are missing (so unsigned CI still works).
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  icon: resources/icon.png
  executableName: Sealed
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  icon: resources/icon.png
  category: Utility
  maintainer: Myrafy <hello@myrafy.com>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

npmRebuild: false

publish:
  provider: github
  owner: Myrafy
  repo: sealed
  releaseType: release
