name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with 100% coverage gate
        run: npm run test:coverage

      - name: Fail if coverage badge is stale
        run: |
          if ! git diff --exit-code -- badges/coverage.json; then
            echo "::error::badges/coverage.json is out of date. Run npm run test:coverage and commit the badge file."
            exit 1
          fi

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const lines = [
                "## Coverage",
                "",
                "| Metric | Coverage |",
                "|--------|----------|",
                `| Lines | ${t.lines.pct}% |`,
                `| Statements | ${t.statements.pct}% |`,
                `| Functions | ${t.functions.pct}% |`,
                `| Branches | ${t.branches.pct}% |`,
                "",
                "Required: **100%** on all metrics (PR fails below that)."
              ];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            badges/coverage.json
          if-no-files-found: ignore
